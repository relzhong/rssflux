services:
  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://miniflux:secret@db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - DISABLE_HSTS=1
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=test123
      - API_KEY=test-api-token-12345
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: miniflux-db
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 10s
    restart: unless-stopped

  rssflux:
    build:
      context: .
      dockerfile: Dockerfile
    image: rssflux:latest
    container_name: rssflux
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      miniflux:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://miniflux:secret@db/miniflux?sslmode=disable
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=change-me
      - SESSION_SECRET=long-random-session-secret-change-in-production
      - MINIFLUX_URL=http://miniflux:8080
      - MINIFLUX_API_TOKEN=test-api-token-12345
      - AI_BASE_URL=https://api.openai.com/v1
      - AI_API_KEY=
      - AI_MODEL=gpt-4o-mini
    restart: unless-stopped

volumes:
  miniflux-db:
