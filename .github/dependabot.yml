version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    # 1. 忽略所有大版本升级（不报任何 Breaking Changes）
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    # 2. 将当周的所有小版本/补丁打包成一个 PR，避免 PR 泛滥
    groups:
      safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    open-pull-requests-limit: 5
    versioning-strategy: auto
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
